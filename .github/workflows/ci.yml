name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agentic
          POSTGRES_PASSWORD: agentic
          POSTGRES_DB: motoro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://agentic:agentic@localhost:5432/motoro_test
      AGENTIC_TEST_DATABASE_URL: postgresql+asyncpg://agentic:agentic@localhost:5432/motoro_test

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Check lockfile is up to date
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Ruff check
        run: uv run ruff check src/

      # Non-blocking on purpose: style drift shouldn't turn the whole build
      # red. `ruff check` above already catches real bugs (unused imports,
      # bad comparisons, etc); this just surfaces formatting drift as a
      # visible warning so it doesn't build up silently. Alembic's own
      # revision files are excluded — they're autogenerated, and reformatting
      # them defeats the point of an autogenerate diff (see the per-file-ignore
      # note in pyproject.toml).
      - name: Ruff format check (warn only)
        continue-on-error: true
        run: uv run ruff format --check --extend-exclude "src/motoro/migrations/versions" src/

      # Non-blocking for the same reason, until the current backlog of
      # pre-existing strict-mode findings (mostly `no-any-return` on
      # SQLAlchemy ORM query results) is paid down. Flip to blocking once
      # that's clean.
      - name: Mypy (warn only)
        continue-on-error: true
        run: uv run mypy src/

      - name: Import boundary check
        run: uv run lint-imports

      - name: Run database migrations
        run: uv run python -m motoro.migrations upgrade

      - name: Pytest
        run: uv run pytest --tb=short -q
