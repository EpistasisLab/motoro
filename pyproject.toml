[project]
name = "agentic-core"
version = "0.0.1"
description = "Headless agentic platform: the Sense-Reason-Plan-Act runtime, pattern engine, MCP integration, and memory."
readme = "README.md"
requires-python = ">=3.12"

# Slice 1 (SRPA loop) dependencies only. Derived from the actual third-party
# imports of the modules in the slice — not copied wholesale from ARES.
# Deliberately absent, and to stay absent unless a slice genuinely needs them:
#   fastapi/uvicorn  — core is headless; the product owns the HTTP layer
#   arq              — arrives with the worker slice
#   python-docx, pymupdf, pyarrow   — dataset/document concerns, product-side
#   bcrypt, email-validator         — auth concerns, undecided for core
dependencies = [
    "pydantic>=2.10.0",
    "pydantic-settings>=2.14.1",
    "sqlalchemy[asyncio]>=2.0.50",
    "asyncpg>=0.30.0",
    # Runtime, not dev: core owns its schema, and a product provisions it by
    # calling agentic_core.migrations.upgrade(). See src/agentic_core/migrations.
    "alembic>=1.18.4",
    "redis>=5.2.0,<6",
    # Semantic/episodic memory: pgvector is the SQLAlchemy Vector type and the
    # server-side extension; sentence-transformers is the default *local*
    # embedding backend (no API key needed). It is imported lazily inside
    # ``memory.embedding._get_local_model`` rather than at module scope, but it
    # still installs eagerly as a direct dependency — a remote-only product pays
    # for it on disk without ever importing it.
    "pgvector>=0.3.6",
    "sentence-transformers>=5.4.1",
    # Range, not a pin. Core is a library: pinning an exact litellm would force
    # it on every product and forbid interpreters that version excludes. ARES
    # pins ==1.85.0, which is right for an application — but 1.85.0 requires
    # Python <3.14, so an exact pin here would make core uninstallable on 3.14.
    "litellm>=1.85.0",
    "instructor>=1.15.1",
    "tenacity>=9.0.0",
    # Capped, unlike litellm's floor-only range above: mcp 2.0.0 renames
    # FastMCP -> MCPServer (a real break) and, more seriously, changes
    # ClientSession's background message-reading task lifecycle so that
    # MCPClient.connect() — which always installs a message_handler, for
    # notifications/tools/list_changed — hangs forever on process exit
    # instead of completing. Verified directly: identical connect/list_tools
    # call succeeds and returns under 1.27.1 (the version ARES actually locks)
    # and hangs indefinitely under 2.0.0. No existing test caught this because
    # none exercised a live server before the MCP persistence layer's tests did.
    "mcp>=1.27.1,<2.0.0",
    "httpx>=0.28.1",
    # Fernet, for encrypting registered MCP servers' auth headers at rest
    # (services.encryption). Already installed transitively today; declared
    # directly because core imports it by name, not by accident of what else
    # happens to depend on it.
    "cryptography>=43.0.0",
    "jsonschema>=4.26.0",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.42.0",
    "opentelemetry-sdk>=1.41.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25.0",
    "opentelemetry-exporter-prometheus>=0.62b1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.15",
    "mypy>=2.1.0",
    "import-linter>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_core"]
# env.py, script.py.mako and versions/ are data files, not modules; without this
# they are absent from an installed core and upgrade() has nothing to run.
artifacts = [
    "src/agentic_core/migrations/env.py",
    "src/agentic_core/migrations/script.py.mako",
    "src/agentic_core/migrations/versions/*.py",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Alembic revisions are generated. Reformatting them makes a diff against what
# autogenerate produced unreadable, which is the one thing a migration should be.
"src/agentic_core/migrations/versions/*.py" = ["E501", "I001", "W291"]

[tool.ruff.lint.isort]
known-first-party = ["agentic_core"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["litellm.*", "instructor.*", "mcp.*", "jsonschema.*", "prometheus_client.*", "grpc.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# --------------------------------------------------------------------------- #
# The boundary, enforced. Core must never import from a product package.
# See ARES project_plan/AGENTIC_CORE_BOUNDARY.md §10.1.
# --------------------------------------------------------------------------- #
[tool.importlinter]
root_packages = ["agentic_core"]

[[tool.importlinter.contracts]]
name = "Core never imports a product"
type = "forbidden"
source_modules = ["agentic_core"]
forbidden_modules = ["ares", "ecoxai"]
